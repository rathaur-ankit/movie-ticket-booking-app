services:
  frontend:
    build:
      context: ./frontend
    container_name: movie-frontend
    ports:
      - '80:80'
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: movie-backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    restart: unless-stopped
