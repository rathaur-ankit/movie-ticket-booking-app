services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CURRENCY: ${VITE_CURRENCY}
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_TMDB_IMAGE_BASE_URL: ${VITE_TMDB_IMAGE_BASE_URL}
    container_name: movie-frontend
    ports:
      - '80:80'
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - movie-net

  backend:
    build:
      context: ./Backend
    container_name: movie-backend
    ports:
      - '5000:5000'
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - movie-net

  mongo:
    image: mongo:7
    container_name: movie-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - movie-net

volumes:
  mongo-data:

networks:
  movie-net:
    driver: bridge
